<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توفيكس | الصيانة أسهل والثقة أوضح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1F3A;--mut:#5A6B82;--blue:#1F5FBF;--blue-l:#EAF1FB;--line:#E3E7ED;--bg:#fff;--soft:#F7F9FB;--ok:#1E8A5A;--ok-l:#E7F5EE;--warn:#B7791F;--bad:#B42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E8EEF7;--mut:#9FB0C6;--blue:#6EA3F0;--blue-l:#14243D;--line:#243449;--bg:#0A1424;--soft:#0F1B2E;--ok:#4FC08D;--ok-l:#0F2A20;--warn:#E3B04B;--bad:#F2877D;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#E8EEF7;--mut:#9FB0C6;--blue:#6EA3F0;--blue-l:#14243D;--line:#243449;--bg:#0A1424;--soft:#0F1B2E;--ok:#4FC08D;--ok-l:#0F2A20;--warn:#E3B04B;--bad:#F2877D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Tajawal,"Segoe UI",Tahoma,sans-serif}
a{color:inherit;text-decoration:none}h1,h2,h3{line-height:1.35;margin:0}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav{display:flex;align-items:center;gap:20px;height:60px;overflow-x:auto;white-space:nowrap}
.logo{font-weight:800;font-size:22px;color:var(--blue)}.logo small{font:500 12px Tajawal;color:var(--mut);margin-inline-start:6px}
nav a.l{color:var(--mut);font-weight:500;font-size:15px}nav a.l:hover,nav a.on{color:var(--ink)}nav .sp{flex:1}
.btn{display:inline-block;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:9px 18px;border-radius:6px;font:700 15px Tajawal;cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#06101F}
.btn.o{background:transparent;color:var(--blue)}.btn.s{padding:5px 12px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{min-height:70vh;padding-bottom:48px}
.hero{background:var(--soft);border-bottom:1px solid var(--line);padding:56px 0 44px}
.hero h1{font-size:clamp(28px,5vw,46px);font-weight:800;max-width:640px}.hero p{color:var(--mut);max-width:560px;font-size:18px;margin:14px 0 24px}
.sb{display:flex;gap:8px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:720px}
.sb input,.sb select{flex:1 1 160px}
input,select,textarea{font:400 15px Tajawal;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.sb input,.sb select{border:0}
section{padding:40px 0}h2{font-size:24px;margin-bottom:18px}h3{font-size:17px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.c{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--bg)}
a.c:hover{border-color:var(--blue)}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--blue-l);color:var(--blue)}
.tag.ok{background:var(--ok-l);color:var(--ok)}.tag.w{background:var(--soft);color:var(--warn);border:1px solid var(--line)}.tag.bad{color:var(--bad);background:var(--soft)}
.ph{width:48px;height:48px;border-radius:8px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.row{display:flex;gap:12px;align-items:center}.row.t{align-items:flex-start}.wrap{flex-wrap:wrap}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.steps .c b{display:block;color:var(--blue);font-size:15px}
.note{background:var(--blue-l);border-radius:6px;padding:10px 14px;font-size:14px;color:var(--ink);margin-bottom:16px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}.err{color:var(--bad);font-size:13px;min-height:18px}
.fm{max-width:460px}.two{display:grid;grid-template-columns:2fr 1fr;gap:20px}@media(max-width:760px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.tw{overflow-x:auto}.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}.tabs a{padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-size:14px}.tabs a.on{background:var(--blue);color:#fff;border-color:var(--blue)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mut);font-size:14px}
.stars button{background:none;border:0;font-size:24px;color:var(--line);cursor:pointer;padding:0}.stars button.on{color:#D9A21B}
.bn{display:block;width:100%;height:auto;border-radius:6px;margin-bottom:12px;border:1px solid var(--line)}img.ph{background:none;object-fit:cover}
.pc{padding:12px}.pc .bn{margin-bottom:12px}
</style>
</head>
<body>
<header><div class="w"><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer><div class="w">توفيكس (tofix) — منصة تربط العملاء بالفنيين والورش في المملكة العربية السعودية. البيانات المعروضة تجريبية ولا تمثل جهات حقيقية.</div></footer>
<script>
const ST_AR=["بانتظار التأكيد","تم قبول الطلب","جارٍ تنفيذ الخدمة","بانتظار تأكيد الإنجاز","مكتمل","ملغي","قيد المراجعة"];
const st=(k,d)=>{try{const v=localStorage.getItem('tofix5_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('tofix5_'+k,JSON.stringify(v))}catch(e){}};
let cats=st('cats',["ميكانيكا السيارات","صيانة السيارات","كهرباء السيارات","صيانة المكيفات","السباكة","الكهرباء المنزلية","الصيانة العامة"]);
const P=st('prov',[
{id:1,n:"ورشة نموذجية للميكانيكا",c:"ميكانيكا السيارات",city:"الرياض",v:true,d:"فحص شامل وإصلاح المحركات وناقل الحركة.",sv:[["فحص كمبيوتر",150],["تغيير زيت وفلتر",120],["إصلاح ناقل الحركة",800]]},
{id:2,n:"فني تكييف نموذجي",c:"صيانة المكيفات",city:"جدة",v:true,d:"صيانة وتنظيف وتعبئة غاز للمكيفات المنزلية.",sv:[["تنظيف مكيف سبليت",90],["تعبئة غاز",180]]},
{id:3,n:"مركز كهرباء السيارات النموذجي",c:"كهرباء السيارات",city:"الدمام",v:false,d:"تشخيص أعطال الكهرباء والبطاريات.",sv:[["تشخيص أعطال",100],["تغيير بطارية",250]]},
{id:4,n:"فني سباكة نموذجي",c:"السباكة",city:"الرياض",v:true,d:"كشف التسريبات وتركيب الأدوات الصحية.",sv:[["كشف تسريب",120],["تركيب خلاط",80]]}]);
let B=st('bk',[{id:1001,p:1,pn:"ورشة نموذجية للميكانيكا",sn:"تغيير زيت وفلتر",price:120,desc:"تغيير زيت دوري لسيارة سيدان.",t:"2026-10-12T10:00",st:4},{id:1002,p:2,pn:"فني تكييف نموذجي",sn:"تنظيف مكيف سبليت",price:90,desc:"المكيف يصدر رائحة ولا يبرّد جيدًا.",t:"2026-10-19T16:00",st:3},{id:1003,p:4,pn:"فني سباكة نموذجي",sn:"كشف تسريب",price:120,desc:"رطوبة في جدار الحمام.",t:"2026-10-24T11:00",st:0}]);
let R=st('rv',[{b:'عينة-1',p:1,s:5,u:'عميل تجريبي ١',t:'عمل منظّم وسعر مطابق لما عُرض قبل الحجز.'},{b:'عينة-2',p:1,s:4,u:'عميل تجريبي ٢',t:'تأخر قليلًا عن الموعد لكن الإنجاز كان ممتازًا.'},{b:'عينة-3',p:1,s:5,u:'عميل تجريبي ٣',t:'شرح لي المشكلة بوضوح قبل البدء.'},{b:'عينة-4',p:2,s:5,u:'عميل تجريبي ٤',t:'التزم بالموعد وترك المكان نظيفًا.'},{b:'عينة-5',p:2,s:4,u:'عميل تجريبي ٥',t:'خدمة جيدة وسعر مناسب.'},{b:'عينة-6',p:4,s:4,u:'عميل تجريبي ٦',t:'وجد التسريب بسرعة.'}]);
let C=st('cp',[{k:'السعر',d:'(مثال تجريبي) طُلب مبلغ أعلى من السعر المعروض.',s:'تم الحل'}]),U=st('user',null),flash='';
const EX={1:{ph:'050 000 0001',ad:'حي الصناعية، الرياض',hr:'٨ ص – ١٠ م'},2:{ph:'050 000 0002',ad:'حي الروضة، جدة',hr:'٩ ص – ٩ م'},3:{ph:'050 000 0003',ad:'حي الفيصلية، الدمام',hr:'٨ ص – ٨ م'},4:{ph:'050 000 0004',ad:'حي النخيل، الرياض',hr:'٧ ص – ١١ م'}};
const ex=p=>EX[p.id]||{ph:'050 000 0000',ad:p.city,hr:'—'};
const mn=p=>p.sv.length?Math.min(...p.sv.map(x=>x[1])):0;
const HUE={1:'#1F5FBF',2:'#0F766E',3:'#6D4AC7',4:'#0369A1'};
const svg=s=>'data:image/svg+xml;utf8,'+encodeURIComponent(s);
const bn=p=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140"><rect width="400" height="140" fill="#0B1F3A"/><rect y="108" width="400" height="32" fill="${HUE[p.id]||'#1F5FBF'}" opacity=".6"/><g fill="none" stroke="#fff" stroke-width="5" opacity=".85" stroke-linecap="round"><circle cx="200" cy="62" r="24"/><path d="M170 62h-40M230 62h40M200 32v-20M200 92v20"/></g><rect x="40" y="84" width="60" height="34" rx="4" fill="#fff" opacity=".14"/><rect x="300" y="74" width="60" height="44" rx="4" fill="#fff" opacity=".14"/></svg>`);
const av=p=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="8" fill="${HUE[p.id]||'#1F5FBF'}"/><text x="24" y="32" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family="Tajawal,sans-serif">${p.n[0]}</text></svg>`);
const mp=p=>svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180"><rect width="400" height="180" fill="#EAF1FB"/><g stroke="#fff" stroke-width="10"><path d="M0 120h400M130 0v180M300 0v180M0 50l400 40"/></g><circle cx="200" cy="84" r="14" fill="#1F5FBF"/><circle cx="200" cy="84" r="5" fill="#fff"/></svg>`);
function fl(k,v){const [p,qs]=(location.hash||'#/explore').split('?');const u=new URLSearchParams(qs||'');v?u.set(k,v):u.delete(k);location.hash=p+'?'+u}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rate=id=>{const p=P.find(x=>x.id==id)||{};const r=R.filter(x=>x.p==id&&x.new);const n=(p.rn||0)+r.length;if(!n)return null;return{a:(((p.ra||0)*(p.rn||0)+r.reduce((s,x)=>s+x.s,0))/n).toFixed(1),n}};
const rt=id=>{const r=rate(id);return r?`★ ${r.a} (${r.n} تقييم موثّق)`:'لا توجد تقييمات موثّقة بعد'};
const vt=p=>p.v?'<span class="tag ok">موثّق</span>':'<span class="tag w">غير موثّق</span>';
const card0=p=>`<a class="c pc" href="#/provider/${p.id}"><img class="bn" alt="" src="${bn(p)}"><div class="row"><img class="ph" alt="" src="${av(p)}"><div><h3>${esc(p.n)}</h3><div class="mut">${p.c} · ${p.city}</div><div class="mut">${mn(p)?'يبدأ من '+mn(p)+' ر.س':'الأسعار تُضاف قريبًا'}</div></div></div><div class="row wrap" style="margin-top:12px">${vt(p)}<span class="mut">${rt(p.id)}</span></div></a>`;
const mapLink=p=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.n+' '+p.city)}`;
const sample='<div class="note">بيانات تجريبية: الجهات المعروضة أمثلة للتصميم فقط، وتُستبدل ببيانات حقيقية بعد ربط قاعدة البيانات.</div>';
function nav(h){const L=[["#/","الرئيسية"],["#/explore","استكشف الخدمات"],["#/bookings","حجوزاتي"],["#/help","المساعدة والشكاوى"],["#/join","انضم كفني"]];
$('#nav').innerHTML=`<a class="logo" href="#/">توفيكس<small>tofix</small></a>`+L.map(l=>`<a class="l ${h===l[0]?'on':''}" href="${l[0]}">${l[1]}</a>`).join('')+`<span class="sp"></span><a class="l" href="#/provider-dash">لوحة الفني</a><a class="l" href="#/admin">الإدارة</a><a class="btn s" href="${U?'#/profile':'#/auth'}">${U?esc(U.name):'تسجيل الدخول'}</a>`}
const V={};
V.home=()=>`<div class="hero"><div class="w"><h1>الصيانة صارت أسهل، والثقة صارت أوضح.</h1><p>اكتشف الفني المناسب، قارن الأسعار، واطّلع على تجارب العملاء الحقيقية قبل ما تحجز.</p>
<form class="sb" onsubmit="event.preventDefault();location.hash='#/explore?q='+encodeURIComponent(this.q.value)+'&city='+encodeURIComponent(this.city.value)"><input name="q" aria-label="بحث" placeholder="ابحث عن خدمة أو فني أو ورشة"><select name="city" aria-label="المدينة"><option value="">كل المدن</option><option>الرياض</option><option>جدة</option><option>الدمام</option><option>مكة المكرمة</option><option>المدينة المنورة</option></select><button class="btn">بحث</button></form><div class="row wrap" style="margin-top:16px"><span class="tag ok">فنيون موثّقون</span><span class="tag">أسعار واضحة قبل الحجز</span><span class="tag">تقييمات من حجوزات مكتملة فقط</span></div></div></div>
<section><div class="w"><h2>فئات الخدمات</h2><div class="g">${cats.map(c=>`<a class="c" href="#/explore?cat=${encodeURIComponent(c)}"><h3>${c}</h3><div class="mut">${P.filter(p=>p.c==c).length} جهة</div></a>`).join('')}</div></div></section>
<section style="background:var(--soft)"><div class="w"><h2>فنيون وورش موثّقة</h2>${sample}<div class="g">${P.filter(p=>p.v).map(card).join('')}</div></div></section>
<section><div class="w"><h2>كيف تعمل توفيكس</h2><div class="steps"><div class="c"><b>١. ابحث</b>اختر الخدمة وقارن الأسعار والتقييمات الموثّقة.</div><div class="c"><b>٢. احجز</b>صف المشكلة واختر موعدًا، وينتظر الفني قبول الطلب.</div><div class="c"><b>٣. أنجز الخدمة</b>أكّد الإنجاز ثم ادفع وقيّم تجربتك.</div></div></div></section>
<section style="background:var(--soft)"><div class="w"><h2>كيف نضمن صدق التقييمات</h2><div class="c"><p style="margin:0">لا يستطيع التقييم إلا العميل الذي أكمل حجزًا فعليًا مع الفني، ويرتبط كل تقييم بالحجز نفسه. يراجع فريق الإدارة التقييمات المبلّغ عنها والمشتبه بها. نعرض عدد التقييمات الموثّقة كما هو، بلا أرقام مضخّمة.</p></div></div></section>
<section><div class="w row wrap"><a class="btn" href="#/explore">ابحث عن فني</a><a class="btn o" href="#/join">سجّل كفني أو ورشة</a></div></section>`;
V.explore=q=>{const f=q.cat||'',s=q.q||'',cy=q.city||'',vo=q.v==='1';
const L=P.filter(p=>(!f||p.c==f)&&(!cy||p.city==cy)&&(!vo||p.v)&&(!s||(p.n+p.c+p.d+p.sv.map(x=>x[0]).join()).includes(s))&&(!q.r||(rate(p.id)&&+rate(p.id).a>=+q.r))&&(!q.mp||(mn(p)&&mn(p)<=+q.mp)));if(q.o=='p')L.sort((a,b)=>mn(a)-mn(b));if(q.o=='r')L.sort((a,b)=>(rate(b.id)?+rate(b.id).a:0)-(rate(a.id)?+rate(a.id).a:0));
return `<div class="w" style="padding-top:28px"><h2>استكشف الخدمات</h2>${sample}
<div class="tabs"><a href="#/explore" class="${!f?'on':''}">الكل</a>${cats.map(c=>`<a href="#/explore?cat=${encodeURIComponent(c)}" class="${f==c?'on':''}">${c}</a>`).join('')}</div>
<div class="row wrap" style="margin-bottom:12px"><select style="width:auto" aria-label="التقييم" onchange="fl('r',this.value)"><option value="">كل التقييمات</option><option value="4" ${q.r=='4'?'selected':''}>٤ نجوم فأكثر</option></select><select style="width:auto" aria-label="السعر" onchange="fl('mp',this.value)"><option value="">أي سعر</option><option value="100" ${q.mp=='100'?'selected':''}>يبدأ حتى 100 ر.س</option><option value="150" ${q.mp=='150'?'selected':''}>يبدأ حتى 150 ر.س</option></select><select style="width:auto" aria-label="الترتيب" onchange="fl('o',this.value)"><option value="">الترتيب الافتراضي</option><option value="p" ${q.o=='p'?'selected':''}>الأقل سعرًا</option><option value="r" ${q.o=='r'?'selected':''}>الأعلى تقييمًا</option></select></div><div class="row wrap" style="margin-bottom:16px"><span class="mut">${L.length} نتيجة</span>${vo?'<a class="tag" href="#/explore'+(f?'?cat='+encodeURIComponent(f):'')+'">إلغاء فلتر الموثّقين ✕</a>':'<a class="tag" href="#/explore?v=1'+(f?'&cat='+encodeURIComponent(f):'')+'">الموثّقون فقط</a>'}${cy?`<span class="tag">${cy}</span>`:''}</div>
${L.length?`<div class="g">${L.map(card).join('')}</div>`:'<div class="c">لا توجد نتائج مطابقة. جرّب تغيير الفئة أو المدينة أو كلمة البحث.</div>'}</div>`};
V.provider=id=>{const p=P.find(x=>x.id==id);if(!p)return'<div class="w"><p>لم يتم العثور على الفني.</p></div>';const rv=R.filter(x=>x.p==id);
return `<div class="w" style="padding-top:28px"><img class="bn" alt="" src="${bn(p)}"><div class="row t"><img class="ph" style="width:64px;height:64px" alt="" src="${av(p)}"><div><h2 style="margin:0">${esc(p.n)}</h2><div class="mut">${p.c} · ${p.city}</div><div class="row wrap" style="margin-top:6px">${vt(p)}<span class="mut">${rt(p.id)}</span></div></div></div>
